<svg xmlns="http://www.w3.org/2000/svg" width="100" height="124" viewBox="0 0 100 124" fill="none">
  <defs>
    <clipPath id="squircle-music-player">
      <rect x="12" y="6" width="76" height="76" rx="17" ry="17" />
    </clipPath>
    <filter id="shadow-music-player" x="6" y="2" width="88" height="88" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <style>
      .app-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 600;
        fill: #1F2328;
      }
      .app-border {
        stroke: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        .app-title {
          fill: #F0F6FC;
        }
        .app-border {
          stroke: rgba(255, 255, 255, 0.15);
        }
      }
    </style>
  </defs>

  <!-- Drop Shadow Base -->
  <rect x="12" y="6" width="76" height="76" rx="17" ry="17" fill="#FFFFFF" filter="url(#shadow-music-player)"/>

  <!-- Icon Image -->
  <image href="data:image/png;base64," x="12" y="6" width="76" height="76" clip-path="url(#squircle-music-player)" preserveAspectRatio="xMidYMid slice" />

  <!-- Subtle Border Ring -->
  <rect x="12" y="6" width="76" height="76" rx="17" ry="17" fill="none" class="app-border" stroke-width="1"/>

  <!-- App Label -->
  <text x="50" y="106" text-anchor="middle" class="app-title">Music Player</text>
</svg>